<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard IoT - Grupo 2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; display: flex; flex-direction: column; align-items: center;}
        .header { display: flex; justify-content: space-between; width: 80%; align-items: center; margin-bottom: 10px; }
        .header h2 { margin: 0; color: #333; }
        button { padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; }
        table { width: 80%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border: 1px solid #ddd; }
        th { background-color: #e9ecef; }
        .pagination { display: flex; justify-content: space-between; width: 80%; margin-top: 20px; align-items: center; }
        .nueva-fila { background-color: #d4edda; transition: background-color 2s ease; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Datos Recibidos (En Vivo)</h2>
        <button onclick="cargarPagina()">Actualizar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Timestamp</th>
                <th>Sensor</th>
                <th>Valor</th>
                <th>Descripción</th>
            </tr>
        </thead>
        <tbody id="tabla-body">
            </tbody>
    </table>

    <div class="pagination">
        <button onclick="anterior()" id="btn-ant">&lt; Anterior</button>
        <span id="page-info">Página 1</span>
        <button onclick="siguiente()" id="btn-sig">Siguiente &gt;</button>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let firstId = null;
        let lastId = null;

        // 1. LÓGICA DE BASE DE DATOS Y PAGINACIÓN KEYSET (Evitando Caché)
        function renderTable(datos) {
            const tbody = document.getElementById('tabla-body');
            tbody.innerHTML = '';
            
            if(datos.length > 0) {
                firstId = datos[0].id; 
                lastId = datos[datos.length - 1].id;
                
                datos.forEach(dato => {
                    tbody.innerHTML += `
                        <tr id="row-${dato.id}">
                            <td>${dato.id}</td>
                            <td>${dato.fecha}</td>
                            <td>${dato.sensor.toUpperCase()}</td>
                            <td>${dato.valor} ${dato.unidad}</td>
                            <td>Estación ${dato.estacion}</td>
                        </tr>
                    `;
                });
            }
            document.getElementById('page-info').innerText = `Página ${currentPage} de ${totalPages}`;
        }

        function cargarPagina() {
            // El '?t=' + getTime() fuerza al navegador a buscar datos frescos
            fetch('/api/lecturas?t=' + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    totalPages = data.total_pages;
                    currentPage = 1;
                    renderTable(data.datos);
                });
        }

        function siguiente() {
            if(currentPage < totalPages && lastId) {
                fetch(`/api/lecturas?last_id=${lastId}&t=` + new Date().getTime())
                    .then(res => res.json())
                    .then(data => {
                        currentPage++;
                        renderTable(data.datos);
                    });
            }
        }

        function anterior() {
            if(currentPage > 1 && firstId) {
                fetch(`/api/lecturas?first_id=${firstId}&t=` + new Date().getTime())
                    .then(res => res.json())
                    .then(data => {
                        currentPage--;
                        renderTable(data.datos);
                    });
            }
        }

        // 2. LÓGICA DE MQTT EN EL NAVEGADOR
        const clientId = "web_" + Math.random().toString(16).substr(2, 8);
        
        // Conexión WebSockets para MQTT (Puerto 8083 por defecto)
        const mqttClient = new Paho.MQTT.Client("mqtt.eict.ce.pucmm.edu.do", 8083, clientId);

        mqttClient.onMessageArrived = function(message) {
            // Solo insertamos en tiempo real si el usuario está en la página 1
            if(currentPage === 1) {
                try {
                    const data = JSON.parse(message.payloadString);
                    const topicParts = message.destinationName.split("/");
                    const estacion = topicParts[3];
                    const sensor = topicParts[5].toUpperCase();
                    
                    const tbody = document.getElementById('tabla-body');
                    const newRow = `
                        <tr class="nueva-fila">
                            <td>-</td> <td>${data.fecha}</td>
                            <td>${sensor}</td>
                            <td>${data.valor} ${data.unidad}</td>
                            <td>Estación ${estacion}</td>
                        </tr>`;
                    
                    // Agregar fila arriba de todo
                    tbody.insertAdjacentHTML('afterbegin', newRow);
                    
                    // Si hay más de 10 filas, borramos la última
                    if(tbody.children.length > 10) {
                        tbody.lastElementChild.remove();
                        lastId = tbody.lastElementChild.id ? tbody.lastElementChild.id.replace('row-', '') : lastId;
                    }

                    // Quitar el color verde después de 2 segundos
                    setTimeout(() => { tbody.firstElementChild.classList.remove('nueva-fila'); }, 2000);
                } catch(e) { console.error("Error parseando MQTT", e); }
            }
        };

        const options = {
            userName: "itt363-grupo2",
            password: "knDH2P6N4w9g",
            useSSL: false, // Cambiar a true si tu profesor activó HTTPS/WSS en el broker
            onSuccess: function() {
                console.log("¡Conectado a MQTT desde el navegador!");
                mqttClient.subscribe("/itt363-grupo2/#");
            },
            onFailure: function(e) {
                console.log("Fallo la conexión MQTT: ", e);
            }
        };

        // Arrancar inmediatamente sin esperar recursos externos
        document.addEventListener('DOMContentLoaded', function() {
            console.log("Estructura lista. Solicitando datos al instante...");
            cargarPagina(); // Llena la tabla inmediatamente
            
            // Iniciamos MQTT un instante después para no bloquear la pantalla
            setTimeout(() => {
                try {
                    mqttClient.connect(options);
                } catch(e) {
                    console.error("Error iniciando MQTT web:", e);
                }
            }, 500);
        });
    </script>
</body>
</html>
